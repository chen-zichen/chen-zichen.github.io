# Publish the static site in ./site to GitHub Pages.
# There is no build step: the HTML in ./site is the final output.
# The publication list is regenerated locally with tools/pubs (see README) and committed.
name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Minimum permissions needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deployment finish instead of cancelling it midway.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload ./site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
